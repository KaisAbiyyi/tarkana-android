name: Android CI

on:
  push:
    branches: [main]
    tags: ['android-v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Minification Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Validate Release Minification (R8 & Resource Shrinking)
        run: ./gradlew assembleRelease --no-daemon

      - name: Archive ProGuard / R8 Mapping File
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r8-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

  release-bundle:
    name: Build Signed Release Bundle (AAB)
    if: startsWith(github.ref, 'refs/tags/android-v') && github.repository == 'KaisAbiyyi/tarkana-android'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Release Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.TARKANA_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TARKANA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TARKANA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TARKANA_RELEASE_KEY_PASSWORD }}
        run: |
          echo "Validating presence of release signing secrets..."
          MISSING=0
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Required secret TARKANA_RELEASE_KEYSTORE_BASE64 is missing or empty"
            MISSING=1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Required secret TARKANA_RELEASE_STORE_PASSWORD is missing or empty"
            MISSING=1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Required secret TARKANA_RELEASE_KEY_ALIAS is missing or empty"
            MISSING=1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Required secret TARKANA_RELEASE_KEY_PASSWORD is missing or empty"
            MISSING=1
          fi
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::Release signing secrets are missing or incomplete. Aborting build."
            exit 1
          fi
          echo "All release signing secrets are present and non-empty."

      - name: Materialize and Validate Keystore
        id: materialize-keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TARKANA_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TARKANA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TARKANA_RELEASE_KEY_ALIAS }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/tarkana-release-upload.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore file is empty or corrupted."
            exit 1
          fi
          echo "Validating keystore format and verifying alias '${KEY_ALIAS}' with keytool..."
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error::Keytool validation failed: alias '${KEY_ALIAS}' not found or store password invalid."
            exit 1
          fi
          echo "Keystore file and alias '${KEY_ALIAS}' verified successfully."
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build Signed App Bundle (AAB)
        env:
          TARKANA_RELEASE_STORE_FILE: ${{ steps.materialize-keystore.outputs.keystore_path }}
          TARKANA_RELEASE_STORE_PASSWORD: ${{ secrets.TARKANA_RELEASE_STORE_PASSWORD }}
          TARKANA_RELEASE_KEY_ALIAS: ${{ secrets.TARKANA_RELEASE_KEY_ALIAS }}
          TARKANA_RELEASE_KEY_PASSWORD: ${{ secrets.TARKANA_RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify Signed AAB Artifact
        run: |
          AAB_FILE="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_FILE" ]; then
            echo "::error::Expected bundle file $AAB_FILE does not exist"
            exit 1
          fi
          echo "Verifying signature of $AAB_FILE with jarsigner..."
          VERIFY_OUTPUT=$(jarsigner -verify "$AAB_FILE" 2>&1 || true)
          echo "$VERIFY_OUTPUT"
          if ! echo "$VERIFY_OUTPUT" | grep -q "jar verified"; then
            echo "::error::Artifact $AAB_FILE is unsigned or signature verification failed! Never archive an unsigned release."
            exit 1
          fi
          if ! unzip -l "$AAB_FILE" | grep -q -E 'META-INF/.*\.(RSA|DSA|EC)'; then
            echo "::error::No signature block file found in META-INF of $AAB_FILE"
            exit 1
          fi
          echo "AAB signature verified successfully."

      - name: Cleanup Keystore
        if: always()
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/tarkana-release-upload.jks"
          if [ -f "$KEYSTORE_PATH" ]; then
            shred -u "$KEYSTORE_PATH" || rm -f "$KEYSTORE_PATH"
          fi

      - name: Archive Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: tarkana-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Archive Production R8 Mapping
        uses: actions/upload-artifact@v4
        with:
          name: tarkana-production-mapping
          path: app/build/outputs/mapping/release/mapping.txt
