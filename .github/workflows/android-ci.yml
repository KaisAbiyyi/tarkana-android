name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Minification Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Validate Release Minification (R8 & Resource Shrinking)
        run: ./gradlew assembleRelease --no-daemon

      - name: Archive ProGuard / R8 Mapping File
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r8-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

  release-bundle:
    name: Build Signed Release Bundle (AAB)
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'KaisAbiyyi/tarkana-android'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Materialize Upload Keystore
        id: materialize-keystore
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/tarkana-release-upload.jks"
          echo "${{ secrets.TARKANA_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build Signed App Bundle (AAB)
        env:
          TARKANA_RELEASE_STORE_FILE: ${{ steps.materialize-keystore.outputs.keystore_path }}
          TARKANA_RELEASE_STORE_PASSWORD: ${{ secrets.TARKANA_RELEASE_STORE_PASSWORD }}
          TARKANA_RELEASE_KEY_ALIAS: ${{ secrets.TARKANA_RELEASE_KEY_ALIAS }}
          TARKANA_RELEASE_KEY_PASSWORD: ${{ secrets.TARKANA_RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Cleanup Keystore
        if: always()
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/tarkana-release-upload.jks"
          if [ -f "$KEYSTORE_PATH" ]; then
            shred -u "$KEYSTORE_PATH" || rm -f "$KEYSTORE_PATH"
          fi

      - name: Archive Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: tarkana-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Archive Production R8 Mapping
        uses: actions/upload-artifact@v4
        with:
          name: tarkana-production-mapping
          path: app/build/outputs/mapping/release/mapping.txt
